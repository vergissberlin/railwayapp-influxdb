version: '3.6'

services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
      - INFLUXDB_DB=vergissberlin
      - INFLUXDB_ADMIN_USER=testadminuser
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD} # Set this in the Railway dashboard as a generated secret (do not hardcode)
      - INFLUXDB_USER=testuser
    ports:
      - 8086:8086
    volumes:
      - ./data/influxdb:/var/lib/influxdb
